apiVersion: v1
kind: ConfigMap
metadata:
  name: ssc-agent-config
  namespace: ssc-agent
data:
  FOUNDRY_PROJECT_ENDPOINT: https://ssc-foundery.services.ai.azure.com/api/projects/ssc-proj-default
  FOUNDRY_MODEL: gpt-5.3-codex
  MSAL_TENANT_ID: 13eb42f4-a065-4aed-a3da-ae0114f35f43
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
  COGNEE_ENABLED: 'true'
  COGNEE_URL: http://cognee:8000
  COGNEE_DATASET: ssc_agent_memory
  COGNEE_TIMEOUT: '10'
  COGNEE_TOP_K: '5'
  KUBERNETES_SHELL_ENABLED: 'true'
  KUBERNETES_SHELL_NAMESPACE: ssc-sandbox
  KUBERNETES_SHELL_IMAGE: mcr.microsoft.com/dotnet/sdk:8.0
  KUBERNETES_SHELL_TIMEOUT: '30'
  KUBERNETES_SHELL_STARTUP_TIMEOUT: '120'
  KUBERNETES_SHELL_CONCURRENCY: '4'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cognee-config
  namespace: ssc-agent
data:
  DB_PROVIDER: postgres
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: cognee_db
  DB_USERNAME: cognee
  CACHE_BACKEND: postgres
  LLM_PROVIDER: azure
  LLM_MODEL: azure/gpt-4.1-mini
  LLM_ENDPOINT: https://ssc-foundery.services.ai.azure.com
  LLM_API_VERSION: 2024-12-01-preview
  EMBEDDING_PROVIDER: openai
  EMBEDDING_MODEL: azure/text-embedding-3-small
  EMBEDDING_ENDPOINT: https://ssc-foundery.services.ai.azure.com/openai/deployments/text-embedding-3-small
  EMBEDDING_API_VERSION: 2024-12-01-preview
  EMBEDDING_DIMENSIONS: '1536'
  COGNEE_SKIP_CONNECTION_TEST: 'true'
  ENABLE_BACKEND_ACCESS_CONTROL: 'false'
  CORS_ALLOWED_ORIGINS: '*'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ssc-agent
data:
  POSTGRES_USER: cognee
  POSTGRES_DB: cognee_db
