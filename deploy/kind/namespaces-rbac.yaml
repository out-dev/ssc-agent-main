apiVersion: v1
kind: Namespace
metadata:
  name: ssc-agent
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: ssc-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssc-agent
  namespace: ssc-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-reaper
  namespace: ssc-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-runner
  namespace: ssc-sandbox
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-runner
  namespace: ssc-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-runner
subjects:
- kind: ServiceAccount
  name: ssc-agent
  namespace: ssc-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-reaper
  namespace: ssc-sandbox
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-reaper
  namespace: ssc-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-reaper
subjects:
- kind: ServiceAccount
  name: sandbox-reaper
  namespace: ssc-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: ssc-sandbox
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-budget
  namespace: ssc-sandbox
spec:
  hard:
    pods: '16'
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '16'
    limits.memory: 8Gi
