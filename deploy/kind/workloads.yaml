apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssc-agent
  namespace: ssc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssc-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssc-agent
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ssc-agent
        image: localhost/ssc-agent:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: ssc-agent-config
        env:
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: AZURE_CLIENT_ID
        - name: AZURE_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: AZURE_TENANT_ID
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: AZURE_CLIENT_SECRET
        - name: COGNEE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: COGNEE_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: workspace-storage
      serviceAccountName: ssc-agent
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ssc-agent
  namespace: ssc-agent
spec:
  selector:
    app.kubernetes.io/name: ssc-agent
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ssc-workspace
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workspace-pv-agent
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ssc-workspace
  hostPath:
    path: /var/lib/ssc-workspace
    type: DirectoryOrCreate
  claimRef:
    namespace: ssc-agent
    name: workspace-storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workspace-pv-sandbox
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ssc-workspace
  hostPath:
    path: /var/lib/ssc-workspace
    type: DirectoryOrCreate
  claimRef:
    namespace: ssc-sandbox
    name: workspace-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-storage
  namespace: ssc-agent
spec:
  storageClassName: ssc-workspace
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-storage
  namespace: ssc-sandbox
spec:
  storageClassName: ssc-workspace
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cognee-storage
  namespace: ssc-agent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee
  namespace: ssc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cognee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognee
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cognee
        image: localhost/ssc-agent-cognee:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: cognee-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: POSTGRES_PASSWORD
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: LLM_API_KEY
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: EMBEDDING_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: storage
          mountPath: /cognee-storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: cognee-storage
      initContainers:
      - name: wait-for-postgres
        image: pgvector/pgvector:pg17
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until pg_isready -h postgres -U "$DB_USERNAME" -d "$DB_NAME"; do sleep 2;
          done
        envFrom:
        - configMapRef:
            name: cognee-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: cognee
  namespace: ssc-agent
spec:
  selector:
    app.kubernetes.io/name: cognee
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ssc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: pgvector/pgvector:pg17
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ssc-agent-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  serviceName: postgres
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ssc-agent
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sandbox-reaper
  namespace: ssc-agent
spec:
  schedule: '*/2 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 300
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: sandbox-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: reaper
            image: localhost/ssc-agent:dev
            imagePullPolicy: IfNotPresent
            command:
            - python
            - -m
            - ssc_agent.kubernetes_shell
            env:
            - name: PYTHONPATH
              value: /app/src
            - name: KUBERNETES_SHELL_NAMESPACE
              value: ssc-sandbox
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
